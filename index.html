<!DOCTYPE html>

<head>
<meta charset="utf-8">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>.promo{display:none;margin:16px 0 0;padding:12px 14px;border-radius:10px;background:rgba(234,243,255,.07);border:1.5px dashed var(--line);color:var(--muted);font-size:.95rem}.promo a{color:var(--chalk);font-weight:600}</style>

<body>
<div class="lang-switch" id="langSwitch">
  <button type="button" data-lang="pl">PL</button>
  <button type="button" data-lang="en">EN</button>
  <button type="button" data-lang="es">ES</button>
</div>
<main>
  <h1 id="title">Gra w domki</h1>
  <p class="sub" id="subtitle">Buduj tak, żeby spełnić wszystkie zasady. Nowe pojawiają się, gdy poprzednie są spełnione.</p>

  <section>
    <div class="tools" id="tools"></div>
    <p class="status" id="status"></p>
    <div class="floor-nav" id="floorNav" style="display:none">
      <button id="floorUp" type="button" title="Piętro wyżej">⬆</button>
      <span id="floorLabel"></span>
      <button id="floorDown" type="button" title="Piętro niżej">⬇</button>
    </div>
    <div class="floor-nav" id="sphereNav" style="display:none">
      <button id="sphereDown" type="button" title="Sfera w lewo">◀</button>
      <span id="sphereLabel"></span>
      <button id="sphereUp" type="button" title="Sfera w prawo">▶</button>
    </div>
    <div class="board-wrap">
      <div class="ghost-board above" id="ghostAbove"></div>
      <div class="board-labeled">
        <div class="col-labels" id="colLabels"></div>
        <div class="row-labels" id="rowLabels"></div>
        <div class="board" id="board"></div>
      </div>
      <div class="ghost-board below" id="ghostBelow"></div>
    </div>
    <button class="reset" id="reset">Zacznij od nowa</button>
  </section>

  <section>
    <p class="progress" id="progress"></p>
    <ol class="rules" id="rules"></ol>
    <p class="promo" id="promo"></p>
    <div id="win"></div>
  </section>
</main>

<script>
/* ====== KONFIGURACJA ====== */
const W = 8;               
const FLOORS = 5;          
const SPHERES = 5;         
const MONASTERY_MIN_DIST = 2.2;   
const TOOLS = {
  hut:       {e:'🛖'},
  monastery: {e:'⛪'},
  grain:     {e:'🌾'},
  water:     {e:'💧'},
  stone:     {e:'🪨'},
  stable:    {e:'🐴'},
  well:      {e:'⛲'},
  torch:     {e:'🔥'},
  hole:      {e:'🕳️'},
  bluefire:  {e:'🔥'},
  university:{e:'🏛️'},
  wizard:    {e:'🧙'},
  monument:  {e:'🗿'},
};
const icon = t => t==='bluefire' ? '<span class="bf">🔥</span>' : TOOLS[t].e;

/* ====== JĘZYKI ====== */
let lang = (navigator.language||navigator.userLanguage||'').toLowerCase().startsWith('pl') ? 'pl' : 'en';

const TOOL_NAMES = {
  pl:{hut:'Chatka',monastery:'Klasztor',grain:'Zboże',water:'Woda',stone:'Kamień',stable:'Stajnia',well:'Studnia',torch:'Pochodnia',hole:'Dziura',bluefire:'Niebieski ogień',university:'Uniwersytet',wizard:'Domek maga',monument:'Pomnik'},
  en:{hut:'Hut',monastery:'Monastery',grain:'Grain',water:'Water',stone:'Stone',stable:'Stable',well:'Well',torch:'Torch',hole:'Hole',bluefire:'Blue fire',university:'University',wizard:'Wizard hut',monument:'Monument'},
  es:{hut:'Choza',monastery:'Monasterio',grain:'Grano',water:'Agua',stone:'Piedra',stable:'Establo',well:'Pozo',torch:'Antorcha',hole:'Agujero',bluefire:'Fuego azul',university:'Universidad',wizard:'Choza del mago',monument:'Monumento'},
};
const TN = t => TOOL_NAMES[lang][t];

const T = {
  pl:{
    max:'Max', tooClose:'Za blisko', groups:'grup: ', huts:'chatek', floorsWord:'pięter', spheresWord:'sfer',
    title:'Gra w domki',
    subtitle:'Buduj tak, żeby spełnić wszystkie zasady. Nowe pojawiają się, gdy poprzednie są spełnione.',
    reset:'Zacznij od nowa', erase:'🗑️ Usuń',
    statusTool:n=>`Zaznaczone: ${n}. Klik na kratkę stawia bloczek.`,
    statusErase:'Gumka: klik na kratkę usuwa bloczek.',
    floorUpTitle:'Piętro wyżej', floorDownTitle:'Piętro niżej',
    floorTop:'Najwyższe piętro', floorBottom:'Najniższe piętro',
    floorMid:(n,t)=>`Piętro ${n} z ${t}`,
    sphereLeftTitle:'Sfera w lewo', sphereRightTitle:'Sfera w prawo',
    sphereLabel:(n,t)=>`Sfera ${n} z ${t}`,
    fire:(ic,nm,n)=>`${ic} Pożar! ${nm} spalił łącznie obiektów: ${n}`,
    unlocked:'Odblokowano: ',
    win:'Gratulacje! Ukończyłeś grę. 🎉',
    promo:'Jeżeli podobają ci się tego typu projekty, zaobserwuj profil twórcy na IG',
    resetConfirm:'Na pewno zacząć od nowa? Cała plansza zostanie wyczyszczona.',
    cellLabel:(f,r,c)=>`Piętro ${f}, kratka ${r}, ${c}`,
    progress:(done,total)=>`Postęp: ${done} / ${total}`,
  },
  en:{
    max:'Max', tooClose:'Too close', groups:'groups: ', huts:'huts', floorsWord:'floors', spheresWord:'spheres',
    title:'The House Game',
    subtitle:'Build so that all the rules are satisfied. New ones appear once the earlier ones are met.',
    reset:'Start over', erase:'🗑️ Erase',
    statusTool:n=>`Selected: ${n}. Click a tile to place it.`,
    statusErase:'Eraser: click a tile to remove it.',
    floorUpTitle:'Floor up', floorDownTitle:'Floor down',
    floorTop:'Top floor', floorBottom:'Bottom floor',
    floorMid:(n,t)=>`Floor ${n} of ${t}`,
    sphereLeftTitle:'Sphere left', sphereRightTitle:'Sphere right',
    sphereLabel:(n,t)=>`Sphere ${n} of ${t}`,
    fire:(ic,nm,n)=>`${ic} Fire! ${nm} burned a total of ${n} objects`,
    unlocked:'Unlocked: ',
    win:'Congratulations! You completed the game. 🎉',
    promo:'If you like projects like this, follow the creator on IG',
    resetConfirm:'Start over for real? The whole board will be cleared.',
    cellLabel:(f,r,c)=>`Floor ${f}, tile ${r}, ${c}`,
    progress:(done,total)=>`Progress: ${done} / ${total}`,
  },
  es:{
    max:'Máx', tooClose:'Demasiado cerca', groups:'grupos: ', huts:'chozas', floorsWord:'pisos', spheresWord:'esferas',
    title:'El juego de las casitas',
    subtitle:'Construye para cumplir todas las reglas. Aparecen nuevas cuando se cumplen las anteriores.',
    reset:'Empezar de nuevo', erase:'🗑️ Borrar',
    statusTool:n=>`Seleccionado: ${n}. Toca una casilla para colocarlo.`,
    statusErase:'Borrador: toca una casilla para quitarlo.',
    floorUpTitle:'Piso arriba', floorDownTitle:'Piso abajo',
    floorTop:'Piso más alto', floorBottom:'Piso más bajo',
    floorMid:(n,t)=>`Piso ${n} de ${t}`,
    sphereLeftTitle:'Esfera a la izquierda', sphereRightTitle:'Esfera a la derecha',
    sphereLabel:(n,t)=>`Esfera ${n} de ${t}`,
    fire:(ic,nm,n)=>`${ic} ¡Incendio! ${nm} quemó en total ${n} objetos`,
    unlocked:'Desbloqueado: ',
    win:'¡Felicidades! Has completado el juego. 🎉',
    promo:'Si te gustan este tipo de proyectos, sigue al creador en IG',
    resetConfirm:'¿Seguro que quieres empezar de nuevo? Se borrará todo el tablero.',
    cellLabel:(f,r,c)=>`Piso ${f}, casilla ${r}, ${c}`,
    progress:(done,total)=>`Progreso: ${done} / ${total}`,
  },
};

const DIGITS = {
  0:['111','101','101','101','111'], 1:['010','010','010','010','010'],
  2:['111','001','111','100','111'], 3:['111','001','111','001','111'],
  4:['101','101','111','001','001'], 5:['111','100','111','001','111'],
  6:['111','100','111','101','111'], 7:['111','001','001','001','001'],
  8:['111','101','111','101','111'], 9:['111','101','111','001','111'],
};
const DIGIT_H = 5, DIGIT_W = 3;
const digitCells = (d,dr,dc) => {
  const out = [];
  DIGITS[d].forEach((row,r)=> [...row].forEach((ch,c)=>{
    if(ch==='1') out.push((dr+r)*W + (dc+c));
  }));
  return out;
};

/* ====== POMOCNICY ====== */
const of = (g,t) => g.cells.flatMap((c,i)=> c===t ? [i] : []);
const localOf  = (g,i) => i % (g.rows*W);      
const floorOf  = (g,i) => Math.floor(i/(g.rows*W));
const numFloorsOf = g => g.cells.length/(g.rows*W);
const nb = (g,i) => {            
  const total=numFloorsOf(g), loc=localOf(g,i), fl=floorOf(g,i), base=fl*g.rows*W;
  const r=Math.floor(loc/W), c=loc%W, o=[];
  if(r>0) o.push(base+(r-1)*W+c); if(r<g.rows-1) o.push(base+(r+1)*W+c);
  if(c>0) o.push(base+r*W+c-1); if(c<W-1) o.push(base+r*W+c+1);
  if(fl>0) o.push((fl-1)*g.rows*W + loc);            
  if(fl<total-1) o.push((fl+1)*g.rows*W + loc);      
  return o;
};
const dist = (g,a,b) => {
  const la=localOf(g,a), lb=localOf(g,b), fa=floorOf(g,a), fb=floorOf(g,b);
  return Math.hypot(Math.floor(la/W)-Math.floor(lb/W), la%W-lb%W, fa-fb);
};
const nb8 = (g,i) => {           
  const total=numFloorsOf(g), loc=localOf(g,i), fl=floorOf(g,i);
  const r=Math.floor(loc/W), c=loc%W, o=[];
  for(let df=-1; df<=1; df++){
    const ff=fl+df; if(ff<0 || ff>=total) continue;
    const base=ff*g.rows*W;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!df && !dr && !dc) continue;
      const rr=r+dr, cc=c+dc;
      if(rr>=0 && rr<g.rows && cc>=0 && cc<W) o.push(base+rr*W+cc);
    }
  }
  return o;
};
/* Woda łączy się też między sferami: to samo pole w sąsiednich sferach jest sąsiadujące. */
const waterNetworks = () => {
  const comp = new Map();            // klucz "sfera:indeks" -> numer sieci
  const sizes = [];
  const key = (sp,i) => sp+':'+i;
  const neighbors = (sp,i) => {
    const sg = {cells:allCells[sp], rows};
    const out = nb(sg,i).map(j=>[sp,j]);
    if(spheresOn){
      if(sp>0) out.push([sp-1,i]);
      if(sp<SPHERES-1) out.push([sp+1,i]);
    }
    return out;
  };
  allCells.forEach((arr,sp)=>arr.forEach((t,i)=>{
    if(t!=='water' || comp.has(key(sp,i))) return;
    const id = sizes.length; let n = 0;
    comp.set(key(sp,i), id); const q=[[sp,i]];
    while(q.length){
      const [a,b] = q.pop(); n++;
      neighbors(a,b).forEach(([sa,sb])=>{
        if(allCells[sa][sb]==='water' && !comp.has(key(sa,sb))){ comp.set(key(sa,sb), id); q.push([sa,sb]); }
      });
    }
    sizes.push(n);
  }));
  return {comp, sizes, key, neighbors};
};
const square = (g,s) => (g.rows - Number(s[1])) * W + (s.charCodeAt(0) - 97);

/* ====== ZASADY ====== */
const RULES = [
  { text:{pl:'Postaw co najmniej 2 chatki.', en:'Place at least 2 huts.', es:'Coloca al menos 2 chozas.'},
    check:g=>{
      const n = allCells.reduce((acc,arr)=>acc+arr.filter(t=>t==='hut').length,0);
      return {ok:n>=2, bad:[], info:n+'/2'};
    } },

  { text:{pl:'Postaw klasztor.', en:'Place a monastery.', es:'Coloca un monasterio.'}, unlock:'monastery',
    check:g=>{
      const total = allCells.reduce((n,arr)=> n + arr.filter(t=>t==='monastery').length, 0);
      return {ok: total>=1, bad:[]};
    } },

  { text:{
      pl:`Klasztor musi być oddalony o minimum ${MONASTERY_MIN_DIST} pola od każdego innego bloku.`,
      en:`The monastery must be at least ${MONASTERY_MIN_DIST} tiles away from every other block.`,
      es:`El monasterio debe estar al menos a ${MONASTERY_MIN_DIST} casillas de cualquier otro bloque.`,
    },
    check:g=>{
      let anyMonastery=false, anyBad=false, bad=[];
      allCells.forEach((arr,s)=>{
        const sg = {cells:arr, rows};
        const ks = of(sg,'monastery');
        if(ks.length) anyMonastery = true;
        ks.forEach(k=>arr.forEach((t,b)=>{
          if(t && b!==k && dist(sg,k,b) < MONASTERY_MIN_DIST){
            anyBad = true;
            if(s===sphere) bad.push(k,b);
          }
        }));
      });
      return {ok:anyMonastery && !anyBad, bad};
    } },

  { text:{pl:'Połóż 3 zboża.', en:'Place 3 grain.', es:'Coloca 3 granos.'}, unlock:'grain',
    check:g=>{
      const n = allCells.reduce((acc,arr)=>acc+arr.filter(t=>t==='grain').length,0);
      return {ok:n>=3, bad:[], info:n+'/3'};
    } },

  { text:{
      pl:'Każde zboże musi sąsiadować z dokładnie jedną chatką.',
      en:'Each grain tile must be adjacent to exactly one hut.',
      es:'Cada grano debe estar junto a exactamente una choza.',
    },
    check:g=>{
      let anyEntity=false, anyBad=false, bad=[];
      allCells.forEach((arr,sp)=>{
        const sg={cells:arr, rows};
        const fs=of(sg,'grain');
        if(fs.length) anyEntity=true;
        const localBad=fs.filter(f=>nb(sg,f).filter(i=>arr[i]==='hut').length!==1);
        if(localBad.length){ anyBad=true; if(sp===sphere) bad.push(...localBad); }
      });
      return {ok:anyEntity && !anyBad, bad};
    } },

  { text:{pl:'Każda chatka musi stykać się z wodą.', en:'Every hut must touch water.', es:'Cada choza debe tocar el agua.'},
    unlock:'water', expand:true,
    check:g=>{
      let anyEntity=false, anyBad=false, bad=[];
      allCells.forEach((arr,sp)=>{
        const sg={cells:arr, rows};
        const hs=of(sg,'hut');
        if(hs.length) anyEntity=true;
        const localBad=hs.filter(h=>!nb(sg,h).some(i=>arr[i]==='water'));
        if(localBad.length){ anyBad=true; if(sp===sphere) bad.push(...localBad); }
      });
      return {ok:anyEntity && !anyBad, bad};
    } },

  { text:{
      pl:'Wszystkie wody muszą być ze sobą połączone.',
      en:'All water tiles must be connected to each other.',
      es:'Toda el agua debe estar conectada entre sí.',
    },
    check:g=>{
      const net = waterNetworks();
      if(!net.sizes.length) return {ok:false, bad:[]};
      const main = net.sizes.indexOf(Math.max(...net.sizes));
      let bad=[];
      allCells[sphere].forEach((t,i)=>{
        if(t==='water' && net.comp.get(net.key(sphere,i))!==main) bad.push(i);
      });
      const anyBad = net.sizes.length > 1;
      const anyEntity = true;
      return {ok:anyEntity && !anyBad, bad};
    } },

  { text:{
      pl:'Chatki muszą tworzyć sieć połączoną skokami szachowego skoczka (w kształcie litery L) – z każdej musisz móc dotrzeć do pozostałych. Skok to przesunięcie o 2 pola w jednym wymiarze, o 1 w drugim i o 0 w trzecim, w dowolnej kolejności wymiarów (także między piętrami).',
      en:'The huts must form a network connected by chess-knight jumps (L-shaped) – from every hut you must be able to reach all the others. A jump is a move of 2 tiles in one dimension, 1 in another and 0 in the third, in any order of dimensions (also between floors).',
      es:'Las chozas deben formar una red conectada por saltos de caballo de ajedrez (en forma de L): desde cada una debes poder llegar a todas las demás. Un salto es un desplazamiento de 2 casillas en una dimensión, 1 en otra y 0 en la tercera, en cualquier orden de dimensiones (también entre pisos).',
    },
    unlock:'stone',
    check:g=>{
      let anyEntity=false, anyBad=false, bad=[], info='';
      allCells.forEach((arr,sp)=>{
        const sg={cells:arr, rows};
        const hs=of(sg,'hut'); if(!hs.length) return;
        anyEntity=true;
        const knight=(a,b)=>{
          const la=localOf(sg,a), lb=localOf(sg,b);
          const d=[Math.floor(la/W)-Math.floor(lb/W), la%W-lb%W, floorOf(sg,a)-floorOf(sg,b)];
          return d.map(Math.abs).sort().join()==='0,1,2';   // o 2, o 1 i o 0 w dowolnych wymiarach
        };
        const seen=new Set(), comps=[];
        hs.forEach(h0=>{
          if(seen.has(h0)) return;
          const grp=[h0]; seen.add(h0);
          for(let j=0;j<grp.length;j++) hs.forEach(o=>{
            if(!seen.has(o) && knight(grp[j],o)){seen.add(o); grp.push(o);}
          });
          comps.push(grp);
        });
        const main=comps.reduce((a,b)=>b.length>a.length?b:a);
        const localBad=hs.filter(h=>!main.includes(h));
        if(localBad.length){ anyBad=true; if(sp===sphere) bad.push(...localBad); }
        if(sp===sphere) info = comps.length>1 ? T[lang].groups+comps.length : '';
      });
      return {ok:anyEntity && !anyBad, bad, info};
    } },

  { text:{
      pl:'Ułóż z kamieni w siatce 3x5 pól ostatnią cyfrę z samej godziny, pomijając minuty (np. dla czasu 14:35 ułóż cyfrę 4).',
      en:'Arrange stones in a 3×5 grid to form the last digit of the current hour, ignoring the minutes (e.g. for 14:35, build the digit 4).',
      es:'Forma con piedras, en una cuadrícula de 3×5, el último dígito de la hora actual, sin contar los minutos (por ejemplo, para las 14:35 dibuja el dígito 4).',
    },
    check:g=>{
      const digit = new Date().getHours()%10;
      const want = digitCells(digit,0,0).length;
      let anyOk=false, currentBest=0;
      allCells.forEach((arr,sp)=>{
        let best = 0;
        for(let dr=0; dr<=rows-DIGIT_H; dr++) for(let dc=0; dc<=W-DIGIT_W; dc++){
          const shape = digitCells(digit,dr,dc);
          const have = shape.filter(i=>arr[i]==='stone').length;
          if(have > best) best = have;
          if(have === shape.length) best = shape.length;
        }
        if(best === want) anyOk = true;
        if(sp===sphere) currentBest = best;
      });
      return {ok: anyOk, bad:[], info:`${currentBest}/${want}`};
    } },

  { text:{pl:'Chatek musi być tyle samo co zbóż.', en:'There must be exactly as many huts as grain tiles.', es:'Debe haber la misma cantidad de chozas que de granos.'},
    check:g=>{
      const h = allCells.reduce((a,arr)=>a+arr.filter(t=>t==='hut').length,0);
      const z = allCells.reduce((a,arr)=>a+arr.filter(t=>t==='grain').length,0);
      return {ok:h>0 && h===z, bad:[], info:`${TOOLS.hut.e} ${h} · ${TOOLS.grain.e} ${z}`};
    } },

  { text:{pl:'Liczba chatek musi być dzielnikiem liczby 392392.', en:'The number of huts must be a divisor of 392392.', es:'El número de chozas debe ser un divisor de 392392.'},
    check:g=>{
      const h = allCells.reduce((a,arr)=>a+arr.filter(t=>t==='hut').length,0);
      return {ok:h>0 && 392392 % h === 0, bad:[], info:`${h} ${T[lang].huts}`};
    } },

  { text:{pl:'Postaw stajnię.', en:'Place a stable.', es:'Coloca un establo.'}, unlock:'stable',
    check:g=>{
      const n = allCells.reduce((a,arr)=>a+arr.filter(t=>t==='stable').length,0);
      return {ok:n>=1, bad:[]};
    } },

  { text:{
      pl:'Odległość między każdą stajnią a najbliższą chatką musi być mniejsza niż 2,5 pola.',
      en:'The distance between every stable and its nearest hut must be less than 2.5 tiles.',
      es:'La distancia entre cada establo y la choza más cercana debe ser menor que 2,5 casillas.',
    },
    check:g=>{
      let anyEntity=false, anyBad=false, bad=[];
      allCells.forEach((arr,sp)=>{
        const sg={cells:arr, rows};
        const st=of(sg,'stable'), hs=of(sg,'hut');
        if(!st.length || !hs.length) return;
        anyEntity=true;
        const localBad = st.filter(s0=>Math.min(...hs.map(h=>dist(sg,s0,h))) >= 2.5);
        if(localBad.length){ anyBad=true; if(sp===sphere) bad.push(...localBad); }
      });
      return {ok:anyEntity && !anyBad, bad};
    } },

  { text:{
      pl:'Żaden klasztor nie może znajdować się na krawędzi planszy.',
      en:'No monastery may be located on the edge of the board.',
      es:'Ningún monasterio puede estar en el borde del tablero.',
    },
    check:g=>{
      const total=numFloorsOf(g), per=g.rows*W;
      const isEdge=(loc,fl,s)=>{
        const r=Math.floor(loc/W), c=loc%W;
        const zEdge = total>1 && (fl===0 || fl===total-1);
        const sEdge = spheresOn && (s===0 || s===SPHERES-1);
        return r===0||c===0||r===g.rows-1||c===W-1||zEdge||sEdge;
      };
      let count=0, anyBad=false, bad=[];
      allCells.forEach((arr,s)=>{
        arr.forEach((t,i)=>{
          if(t!=='monastery') return;
          count++;
          const loc=i%per, fl=Math.floor(i/per);
          if(isEdge(loc,fl,s)){ anyBad=true; if(s===sphere) bad.push(i); }
        });
      });
      return {ok:count>0 && !anyBad, bad};
    } },

  { text:{
      pl:'Przynamniej jedna studnia musi bezpośrednio sąsiadować (wliczając skosy) z co najmniej 6 różnymi rodzajami bloków.',
      en:'At least one well must be directly adjacent (including diagonals) to at least 6 different kinds of blocks.',
      es:'Al menos un pozo debe estar directamente junto (incluidas las diagonales) a al menos 6 tipos diferentes de bloques.',
    },
    unlock:'well',
    check:g=>{
      let anyOk=false, currentBest=0, currentHas=false;
      allCells.forEach((arr,sp)=>{
        const sg={cells:arr, rows};
        const ws=of(sg,'well');
        const variety=i=>new Set(nb8(sg,i).map(j=>arr[j]).filter(Boolean)).size;
        const best = ws.length ? Math.max(...ws.map(variety)) : 0;
        if(ws.length>0 && best>=6) anyOk=true;

/* ====== STAN ====== */
let cells, rows, numFloors, floor, stage, tool, notice, pop, newRule, allCells, sphere, spheresOn;
function init(){
  allCells = Array.from({length:SPHERES}, ()=>Array(W).fill(null));
  sphere = 0; cells = allCells[sphere]; spheresOn = false;
  rows = 1; numFloors = 1; floor = 0; stage = 1; tool = 'hut'; notice = '';
  update();
}
const grid = () => ({cells, rows});
const revealed = () => RULES.slice(0, stage);
const unlocked = () => ['hut', ...revealed().map(r=>r.unlock).filter(Boolean)];

function update(){
  const before = unlocked();
  const s0 = stage;
  while(stage < RULES.length && revealed().every(r=>r.check(grid()).ok)) stage++;
  if(stage > s0) newRule = stage - 1;
  if(revealed().some(r=>r.expand) && rows === 1){
    rows = W;
    allCells = allCells.map(arr=>arr.concat(Array(W*(W-1)).fill(null)));
    cells = allCells[sphere];
  }
  if(revealed().some(r=>r.floors) && numFloors === 1){
    numFloors = FLOORS;
    allCells = allCells.map(arr=>arr.concat(Array(rows*W*(FLOORS-1)).fill(null)));
    cells = allCells[sphere];
  }
  spheresOn = revealed().some(r=>r.spheres);
  const fresh = unlocked().filter(t=>!before.includes(t));
  if(fresh.length) notice = (notice ? notice+' · ' : '') + T[lang].unlocked + fresh.map(t=>TOOLS[t].e+' '+TN(t)).join(', ');
  render();
}

function wizardSwap(idx){
  const filled = cells.flatMap((t,i)=> t && i!==idx ? [i] : []);
  if(new Set(filled.map(i=>cells[i])).size < 2) return null;
  const a = filled[Math.floor(Math.random()*filled.length)];
  const others = filled.filter(i=>cells[i]!==cells[a]);
  const b = others[Math.floor(Math.random()*others.length)];
  [cells[a], cells[b]] = [cells[b], cells[a]];
  return [a,b];
}

function changeFloor(delta){
  const nf = floor + delta;
  if(nf<0 || nf>=numFloors) return;
  const boardEl = document.getElementById('board');
  boardEl.classList.add('switching');
  setTimeout(()=>{
    floor = nf;
    render();
    requestAnimationFrame(()=> document.getElementById('board').classList.remove('switching'));
  }, 140);
}

function testUnlockAll(){            // tryb testowy: klawisz 0 odblokowuje wszystko
  stage = RULES.length;
  if(rows === 1){
    rows = W;
    allCells = allCells.map(arr=>arr.concat(Array(W*(W-1)).fill(null)));
  }
  if(numFloors === 1){
    numFloors = FLOORS;
    allCells = allCells.map(arr=>arr.concat(Array(rows*W*(FLOORS-1)).fill(null)));
  }
  sphere = 0;
  loadPreset();
  cells = allCells[sphere];
  floor = 0;
  spheresOn = true;
  notice = '';
  render();
}

    [
      '........',   // 8

    ],

    ['.t.nnn..',E8,E8,E8,E8,E8,E8,E8],   // piętro 1: 3 pomniki
    ['..nnnn..',E8,E8,E8,E8,E8,E8,E8],   // piętro 2: 4 pomniki

function loadPreset(){
  PRESET.forEach((floors, sp)=>{
    const arr = allCells[sp]; arr.fill(null);
    floors.forEach((fl, f)=>{
      fl.forEach((line, r)=>{
        [...line].forEach((ch, c)=>{
          if(PRESET_KEYS[ch]) arr[f*rows*W + r*W + c] = PRESET_KEYS[ch];
        });
      });
    });
  });
}

function changeSphere(delta){
  const ns = sphere + delta;
  if(ns<0 || ns>=SPHERES) return;
  const boardEl = document.getElementById('board');
  boardEl.classList.add('switching');
  setTimeout(()=>{
    sphere = ns;
    cells = allCells[sphere];
    render();
    requestAnimationFrame(()=> document.getElementById('board').classList.remove('switching'));
  }, 140);
}

function applyLangStatic(){
  document.getElementById('title').textContent = T[lang].title;
  document.getElementById('subtitle').textContent = T[lang].subtitle;
  document.getElementById('reset').textContent = T[lang].reset;
  document.querySelectorAll('#langSwitch button').forEach(b=> b.setAttribute('aria-pressed', b.dataset.lang===lang));
  document.documentElement.lang = lang;
}

/* ====== WIDOK ====== */
function render(){
  const g = grid();
  const results = revealed().map(r=>r.check(g));
  const bad = new Set(results.flatMap(r=>r.bad));

  const tools = document.getElementById('tools'); tools.innerHTML = '';
  unlocked().forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tool'; b.innerHTML = icon(t)+' '+TN(t);
    b.setAttribute('aria-pressed', tool===t);
    b.onclick = ()=>{ tool = tool===t ? null : t; notice=''; render(); };
    tools.appendChild(b);
  });
  const er = document.createElement('button');            
  er.className = 'tool'; er.textContent = T[lang].erase;
  er.setAttribute('aria-pressed', tool===null);
  er.onclick = ()=>{ tool = null; notice=''; render(); };
  tools.appendChild(er);
  document.getElementById('status').textContent = notice ||
    (tool ? T[lang].statusTool(TN(tool)) : T[lang].statusErase);

  const board = document.getElementById('board'); board.innerHTML = '';
  const floorBase = floor*rows*W;
  for(let loc=0; loc<rows*W; loc++){
    const i = floorBase + loc;
    const t = cells[i];
    const b = document.createElement('button');
    b.className = 'cell' + (t?' '+t:'') + (bad.has(i)?' bad':'') + (pop&&pop.includes(i)?' pop':'');
    b.innerHTML = t ? icon(t) : '';
    const r=Math.floor(loc/W)+1, c=loc%W+1;
    b.setAttribute('aria-label', T[lang].cellLabel(floor+1, r, c) + (t?': '+TN(t):''));
    b.onclick = ()=>{
      const prev = cells[i];
      cells[i] = tool; pop = tool ? [i] : null; notice='';
      if(tool && prev!==tool){
        if(tool==='torch' || tool==='bluefire'){      // ogień wywołuje pożar łańcuchowy
          const flammable = ['hut', 'grain', 'monastery', 'stable'];
          const g = grid();
          const burned = new Set();
          const q = nb(g, i).filter(j => flammable.includes(cells[j]));
          
          while(q.length) {
            const curr = q.pop();
            if(!burned.has(curr)) {
              burned.add(curr);
              nb(g, curr).forEach(n => {
                if(flammable.includes(cells[n]) && !burned.has(n)) {
                  q.push(n);
                }
              });
            }
          }

          if(burned.size > 0){
            burned.forEach(j => cells[j] = tool);
            pop.push(...burned);
            notice = T[lang].fire(TOOLS[tool].e, TN(tool), burned.size);
          }
        }
        if(tool==='wizard'){                      // mag miesza 2 losowe bloki (bez ujawniania jakie)
          const sw = wizardSwap(i);
          if(sw) pop.push(...sw);
        }
      }
      update();
    };
    board.appendChild(b);
  }

  // Dynamiczne rysowanie numeracji rzędów w oparciu o aktualną wartość `rows`
  const rowsEl = document.getElementById('rowLabels');
  if(rowsEl.children.length !== rows) {
    rowsEl.innerHTML = '';
    for(let n=rows; n>=1; n--) {
      const s = document.createElement('span'); 
      s.textContent = n; 
      rowsEl.appendChild(s);
    }
    rowsEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  }

  const floorUpBtn = document.getElementById('floorUp'), floorDownBtn = document.getElementById('floorDown');
  floorUpBtn.title = T[lang].floorUpTitle; floorDownBtn.title = T[lang].floorDownTitle;
  const nav = document.getElementById('floorNav');
  nav.style.display = numFloors>1 ? 'flex' : 'none';
  if(numFloors>1){
    floorUpBtn.disabled = floor===0;
    floorDownBtn.disabled = floor===numFloors-1;
    document.getElementById('floorLabel').textContent =
      floor===0 ? T[lang].floorTop
      : floor===numFloors-1 ? T[lang].floorBottom
      : T[lang].floorMid(floor+1, numFloors);
  }
  const sphereUpBtn = document.getElementById('sphereUp'), sphereDownBtn = document.getElementById('sphereDown');
  sphereDownBtn.title = T[lang].sphereLeftTitle; sphereUpBtn.title = T[lang].sphereRightTitle;
  const snav = document.getElementById('sphereNav');
  snav.style.display = spheresOn ? 'flex' : 'none';
  if(spheresOn){
    sphereDownBtn.disabled = sphere===0;
    sphereUpBtn.disabled = sphere===SPHERES-1;
    document.getElementById('sphereLabel').textContent = T[lang].sphereLabel(sphere+1, SPHERES);
  }
  const renderGhost = (elId, fl) => {
    const el = document.getElementById(elId);
    if(fl<0 || fl>=numFloors){ el.style.display='none'; el.innerHTML=''; return; }
    el.style.display = 'grid'; el.innerHTML = '';
    const base = fl*rows*W;
    for(let loc=0; loc<rows*W; loc++){
      const t = cells[base+loc];
      const d = document.createElement('div');
      d.className = 'ghost-cell' + (t?' '+t:'');
      d.innerHTML = t ? icon(t) : '';
      el.appendChild(d);
    }
  };
  renderGhost('ghostAbove', floor-1);
  renderGhost('ghostBelow', floor+1);

  const solvedCount = results.filter(r=>r.ok).length;
  document.getElementById('progress').textContent = T[lang].progress(solvedCount, RULES.length);

  const list = document.getElementById('rules'); list.innerHTML = '';
  const order = [...Array(stage).keys()].reverse()     
    .sort((a,b)=> results[a].ok - results[b].ok);      
  for(const k of order){
    const r = results[k], li = document.createElement('li');
    li.className = 'rule' + (r.ok?' ok':'') + (k===newRule?' new':'');
    li.innerHTML = `<span class="mark">${r.ok?'✓':'✗'}</span><span></span><span class="info"></span>`;
    const txt = RULES[k].text[lang];
    li.children[1].innerHTML = `${k+1}. ${txt}`;
    li.children[2].textContent = r.info || '';
    list.appendChild(li);
  }
  const promo = document.getElementById('promo');
  if(stage >= 16){                                   // po odblokowaniu zasady 16
    promo.innerHTML = `${T[lang].promo} <a href="https://www.instagram.com/szyrgol/" target="_blank" rel="noopener noreferrer">@szyrgol</a>`;
    promo.style.display = 'block';
  } else { promo.style.display = 'none'; promo.innerHTML = ''; }
  document.getElementById('win').innerHTML =
    (stage===RULES.length && results.every(r=>r.ok))
      ? `<div class="win">${T[lang].win}</div>` : '';
  pop = null; newRule = null;
}

document.getElementById('reset').onclick = ()=>{
  if(confirm(T[lang].resetConfirm)) init();
};
document.getElementById('floorUp').onclick = ()=>changeFloor(-1);
document.getElementById('floorDown').onclick = ()=>changeFloor(1);
document.getElementById('sphereUp').onclick = ()=>changeSphere(1);
document.getElementById('sphereDown').onclick = ()=>changeSphere(-1);
document.querySelectorAll('#langSwitch button').forEach(b=>{
  b.onclick = ()=>{ lang = b.dataset.lang; applyLangStatic(); render(); };
});
document.addEventListener('keydown', e=>{             // tryb testowy
  if(e.key === '0') testUnlockAll();
});
(function initLabels(){                      
  const cols = document.getElementById('colLabels');
  'ABCDEFGH'.split('').forEach(ch=>{ const s=document.createElement('span'); s.textContent=ch; cols.appendChild(s); });
})();
applyLangStatic();
init();
setInterval(()=>{ notice=''; update(); }, 30000);   

</script>
