<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gra w domki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <h1>Gra w domki</h1>
  <p class="sub">Buduj tak, żeby spełnić wszystkie zasady. Nowe pojawiają się, gdy poprzednie są spełnione.</p>

  <section>
    <div class="tools" id="tools"></div>
    <p class="status" id="status"></p>
    <div class="floor-nav" id="floorNav" style="display:none">
      <button id="floorUp" type="button" title="Piętro wyżej">⬆</button>
      <span id="floorLabel"></span>
      <button id="floorDown" type="button" title="Piętro niżej">⬇</button>
    </div>
    <div class="board-wrap">
      <div class="ghost-board above" id="ghostAbove"></div>
      <div class="board-labeled">
        <div class="col-labels" id="colLabels"></div>
        <div class="row-labels" id="rowLabels"></div>
        <div class="board" id="board"></div>
      </div>
      <div class="ghost-board below" id="ghostBelow"></div>
    </div>
    <button class="reset" id="reset">Zacznij od nowa</button>
  </section>

  <section>
    <ol class="rules" id="rules"></ol>
    <div id="win"></div>
  </section>
</main>

<script>
/* ====== KONFIGURACJA ====== */
const W = 8;               
const FLOORS = 5;          
const MONASTERY_MIN_DIST = 2.2;   
const TOOLS = {
  hut:       {e:'🛖', n:'Chatka'},
  monastery: {e:'⛪', n:'Klasztor'},
  grain:     {e:'🌾', n:'Zboże'},
  water:     {e:'💧', n:'Woda'},
  stone:     {e:'🪨', n:'Kamień'},
  stable:    {e:'🐴', n:'Stajnia'},
  well:      {e:'⛲', n:'Studnia'},
  torch:     {e:'🔥', n:'Pochodnia'},
  hole:      {e:'🕳️', n:'Dziura'},
};

const DIGITS = {
  0:['111','101','101','101','111'], 1:['010','010','010','010','010'],
  2:['111','001','111','100','111'], 3:['111','001','111','001','111'],
  4:['101','101','111','001','001'], 5:['111','100','111','001','111'],
  6:['111','100','111','101','111'], 7:['111','001','001','001','001'],
  8:['111','101','111','101','111'], 9:['111','101','111','001','111'],
};
const DIGIT_H = 5, DIGIT_W = 3;
const digitCells = (d,dr,dc) => {
  const out = [];
  DIGITS[d].forEach((row,r)=> [...row].forEach((ch,c)=>{
    if(ch==='1') out.push((dr+r)*W + (dc+c));
  }));
  return out;
};

/* ====== POMOCNICY ====== */
const of = (g,t) => g.cells.flatMap((c,i)=> c===t ? [i] : []);
const localOf  = (g,i) => i % (g.rows*W);      
const floorOf  = (g,i) => Math.floor(i/(g.rows*W));
const numFloorsOf = g => g.cells.length/(g.rows*W);
const nb = (g,i) => {            
  const total=numFloorsOf(g), loc=localOf(g,i), fl=floorOf(g,i), base=fl*g.rows*W;
  const r=Math.floor(loc/W), c=loc%W, o=[];
  if(r>0) o.push(base+(r-1)*W+c); if(r<g.rows-1) o.push(base+(r+1)*W+c);
  if(c>0) o.push(base+r*W+c-1); if(c<W-1) o.push(base+r*W+c+1);
  if(fl>0) o.push((fl-1)*g.rows*W + loc);            
  if(fl<total-1) o.push((fl+1)*g.rows*W + loc);      
  return o;
};
const dist = (g,a,b) => {
  const la=localOf(g,a), lb=localOf(g,b), fa=floorOf(g,a), fb=floorOf(g,b);
  return Math.hypot(Math.floor(la/W)-Math.floor(lb/W), la%W-lb%W, fa-fb);
};
const nb8 = (g,i) => {           
  const total=numFloorsOf(g), loc=localOf(g,i), fl=floorOf(g,i);
  const r=Math.floor(loc/W), c=loc%W, o=[];
  for(let df=-1; df<=1; df++){
    const ff=fl+df; if(ff<0 || ff>=total) continue;
    const base=ff*g.rows*W;
    for(let dr=-1;dr<=1;dr++) for(let dc=-1;dc<=1;dc++){
      if(!df && !dr && !dc) continue;
      const rr=r+dr, cc=c+dc;
      if(rr>=0 && rr<g.rows && cc>=0 && cc<W) o.push(base+rr*W+cc);
    }
  }
  return o;
};
const square = (g,s) => (g.rows - Number(s[1])) * W + (s.charCodeAt(0) - 97);

/* ====== ZASADY ====== */
const RULES = [
  { text:'Postaw co najmniej 2 chatki.',
    check:g=>{const n=of(g,'hut').length; return {ok:n>=2, bad:[], info:n+'/2'};} },

  { text:'Postaw klasztor.', unlock:'monastery',
    check:g=>({ok:of(g,'monastery').length>=1, bad:[]}) },

  { text:`Klasztor musi być oddalony o minimum ${MONASTERY_MIN_DIST} pola od każdego innego bloku.`,
    check:g=>{
      const ks=of(g,'monastery'), bad=[];
      ks.forEach(k=>g.cells.forEach((t,b)=>{      
        if(t && b!==k && dist(g,k,b) < MONASTERY_MIN_DIST) bad.push(k,b);
      }));
      return {ok:ks.length>0 && !bad.length, bad};
    } },

  { text:'Połóż 3 zboża.', unlock:'grain',
    check:g=>{const n=of(g,'grain').length; return {ok:n>=3, bad:[], info:n+'/3'};} },

  { text:'Każde zboże musi sąsiadować z dokładnie jedną chatką.',
    check:g=>{
      const fs=of(g,'grain');
      const bad=fs.filter(f=>nb(g,f).filter(i=>g.cells[i]==='hut').length!==1);
      return {ok:fs.length>0 && !bad.length, bad};
    } },

  { text:'Każda chatka musi stykać się z wodą.', unlock:'water', expand:true,
    check:g=>{
      const hs=of(g,'hut');
      const bad=hs.filter(h=>!nb(g,h).some(i=>g.cells[i]==='water'));
      return {ok:hs.length>0 && !bad.length, bad};
    } },

  { text:'Wszystkie wody muszą być ze sobą połączone.',
    check:g=>{
      const ws=of(g,'water'); if(!ws.length) return {ok:false,bad:[]};
      const seen=new Set([ws[0]]), q=[ws[0]];
      while(q.length) nb(g,q.pop()).forEach(i=>{
        if(g.cells[i]==='water' && !seen.has(i)){seen.add(i); q.push(i);}
      });
      const bad=ws.filter(i=>!seen.has(i));
      return {ok:!bad.length, bad};
    } },

  { text:'Chatki muszą tworzyć sieć połączoną skokami szachowego skoczka (w kształcie litery L) – z każdej musisz móc dotrzeć do pozostałych.',
    unlock:'stone',
    check:g=>{
      const hs=of(g,'hut'); if(!hs.length) return {ok:false,bad:[]};
      const knight=(a,b)=>{
        const la=localOf(g,a), lb=localOf(g,b);
        return Math.abs(Math.floor(la/W)-Math.floor(lb/W)) * Math.abs(la%W-lb%W) === 2;
      };
      const seen=new Set(), comps=[];
      hs.forEach(s=>{
        if(seen.has(s)) return;
        const grp=[s]; seen.add(s);
        for(let j=0;j<grp.length;j++) hs.forEach(o=>{
          if(!seen.has(o) && knight(grp[j],o)){seen.add(o); grp.push(o);}
        });
        comps.push(grp);
      });
      const main=comps.reduce((a,b)=>b.length>a.length?b:a);
      const bad=hs.filter(h=>!main.includes(h));
      return {ok:!bad.length, bad, info:comps.length>1 ? 'grup: '+comps.length : ''};
    } },

  { text:()=>`Ułóż z kamieni w siatce 3x5 pól ostatnią cyfrę z samej godziny, pomijając minuty (np. dla czasu 14:35 ułóż cyfrę 4).`,
    check:g=>{
      const digit = new Date().getHours()%10;
      const st = of(g,'stone');
      const want = digitCells(digit,0,0).length;    
      if(!st.length) return {ok:false, bad:[], info:`0/${want}`};
      let best = 0;
      for(let dr=0; dr<=g.rows-DIGIT_H; dr++) for(let dc=0; dc<=W-DIGIT_W; dc++){
        const shape = digitCells(digit,dr,dc);
        const have = shape.filter(i=>g.cells[i]==='stone').length;
        if(have > best) best = have;
        if(have === shape.length) return {ok:true, bad:[], info:`${want}/${want}`};
      }
      return {ok:false, bad:[], info:`${best}/${want}`};
    } },

  { text:'Chatek musi być tyle samo co zbóż.',
    check:g=>{
      const h=of(g,'hut').length, z=of(g,'grain').length;
      return {ok:h>0 && h===z, bad:[], info:`${TOOLS.hut.e} ${h} · ${TOOLS.grain.e} ${z}`};
    } },

  { text:'Liczba chatek musi być dzielnikiem liczby 392392.',
    check:g=>{
      const h=of(g,'hut').length;
      return {ok:h>0 && 392392 % h === 0, bad:[], info:`${h} chatek`};
    } },

  { text:'Postaw stajnię.', unlock:'stable',
    check:g=>({ok:of(g,'stable').length>=1, bad:[]}) },

  { text:'Odległość między każdą stajnią a najbliższą chatką musi być mniejsza niż 2,5 pola.',
    check:g=>{
      const st=of(g,'stable'), hs=of(g,'hut');
      if(!st.length || !hs.length) return {ok:false, bad:[]};
      const bad = st.filter(s=>Math.min(...hs.map(h=>dist(g,s,h))) >= 2.5);
      return {ok:!bad.length, bad};
    } },

  { text:'Żaden klasztor nie może znajdować się na krawędzi planszy (ani na najwyższym/najniższym piętrze, gdy piętra już istnieją).',
    check:g=>{
      const ks=of(g,'monastery');
      const total=numFloorsOf(g);
      const edge=i=>{
        const loc=localOf(g,i), r=Math.floor(loc/W), c=loc%W, fl=floorOf(g,i);
        const zEdge = total>1 && (fl===0 || fl===total-1);
        return r===0||c===0||r===g.rows-1||c===W-1||zEdge;
      };
      const bad=ks.filter(edge);
      return {ok:ks.length>0 && !bad.length, bad};
    } },

  { text:'Przynamniej jedna studnia musi bezpośrednio sąsiadować (wliczając skosy) z co najmniej 6 różnymi rodzajami bloków.',
    unlock:'well',
    check:g=>{
      const ws=of(g,'well');
      const variety=i=>new Set(nb8(g,i).map(j=>g.cells[j]).filter(Boolean)).size;
      const ok = ws.length>0 && ws.some(w=>variety(w)>=6);
      const best = ws.length ? Math.max(...ws.map(variety)) : 0;
      return {ok, bad:[], info: ws.length ? `${best}/6` : ''};
    } },

  { text:'Odległość między każdą stajnią a chatką musi być większa niż 2 pola.',
    check:g=>{
      const st=of(g,'stable'), hs=of(g,'hut');
      if(!st.length || !hs.length) return {ok:false, bad:[]};
      const bad = st.filter(s=>Math.min(...hs.map(h=>dist(g,s,h))) <= 2);
      return {ok:!bad.length, bad};
    } },

  { text:'Zapisz w dolnym rzędzie liczbę zbóż, używając chatek jako kodu binarnego (chatka = 1, brak chatki = 0).',
    check:g=>{
      const grain = of(g,'grain').length;
      const rowStart = (g.rows-1)*W;
      const bits = [...Array(W).keys()].map(c=> g.cells[rowStart+c]==='hut' ? 1 : 0);
      const value = bits.reduce((acc,b)=>acc*2+b, 0);
      return {ok: grain>0 && value===grain, bad:[], info:`${value} / ${grain}`};
    } },

  { text:'Umieść wodę na czterech polach zgodnie z początkiem piosenki https://youtu.be/Fy-k60iEpb4', unlock:'torch',
    check:g=>{
      const need=['e4','c6','d4','d5'].map(s=>square(g,s));
      return {ok: need.every(i=>g.cells[i]==='water'), bad:[]};
    } },

  { text:'Liczba kamieni ma być równa liczbie starców a liczba pochodni liczbie lamp ognistych (zgodnie z Apokalipsą św. Jana 4,4).',
    check:g=>({ok: of(g,'stone').length===24 && of(g,'torch').length===7, bad:[]}) },

  { text:`Pod każdą studnią, na piętrze niżej, musi być woda.`,
    floors:true,
    check:g=>{
      const totalFloors = g.cells.length / (g.rows*W);
      const ws = of(g,'well');
      const bad = ws.filter(w=>{
        const fl = floorOf(g,w);
        if(fl+1 >= totalFloors) return true;             
        const below = (fl+1)*g.rows*W + localOf(g,w);
        return g.cells[below] !== 'water';
      });
      return {ok: ws.length>0 && !bad.length, bad};
    } },

  { text:'Postaw dokładnie dwie dziury, umieszczając je skrajnie najdalej od siebie jak to tylko możliwe.',
    unlock:'hole',
    check:g=>{
      const holes = of(g, 'hole');
      if(holes.length !== 2) return {ok: false, bad: holes.length > 2 ? holes : [], info: `${holes.length}/2`};
      const d = dist(g, holes[0], holes[1]);
      const maxD = Math.hypot(g.rows - 1, W - 1, numFloorsOf(g) - 1);
      const ok = Math.abs(d - maxD) < 0.001;
      return {ok, bad: ok ? [] : holes, info: ok ? 'Max' : 'Za blisko'};
    } },

  { text:'Fkdwhn pxvl ebć grnłdgqlh r slęć zlęfhm qlż vwdmql. (Klucz 3)',
    check:g=>{
      const h=of(g,'hut').length, s=of(g,'stable').length;
      return {ok: h===s+5, bad:[], info:`${TOOLS.hut.e} ${h} · ${TOOLS.stable.e} ${s}`};
    } },
];

/* ====== STAN ====== */
let cells, rows, numFloors, floor, stage, tool, notice, pop, newRule;
function init(){
  cells = Array(W).fill(null); rows = 1; numFloors = 1; floor = 0; stage = 1; tool = 'hut'; notice = '';
  update();
}
const grid = () => ({cells, rows});
const revealed = () => RULES.slice(0, stage);
const unlocked = () => ['hut', ...revealed().map(r=>r.unlock).filter(Boolean)];

function update(){
  const before = unlocked();
  const s0 = stage;
  while(stage < RULES.length && revealed().every(r=>r.check(grid()).ok)) stage++;
  if(stage > s0) newRule = stage - 1;
  if(revealed().some(r=>r.expand) && rows === 1){
    rows = W; cells = cells.concat(Array(W*(W-1)).fill(null));
  }
  if(revealed().some(r=>r.floors) && numFloors === 1){
    numFloors = FLOORS; cells = cells.concat(Array(rows*W*(FLOORS-1)).fill(null));
  }
  const fresh = unlocked().filter(t=>!before.includes(t));
  if(fresh.length) notice = 'Odblokowano: ' + fresh.map(t=>TOOLS[t].e+' '+TOOLS[t].n).join(', ');
  render();
}

function changeFloor(delta){
  const nf = floor + delta;
  if(nf<0 || nf>=numFloors) return;
  const boardEl = document.getElementById('board');
  boardEl.classList.add('switching');
  setTimeout(()=>{
    floor = nf;
    render();
    requestAnimationFrame(()=> document.getElementById('board').classList.remove('switching'));
  }, 140);
}

/* ====== WIDOK ====== */
function render(){
  const g = grid();
  const results = revealed().map(r=>r.check(g));
  const bad = new Set(results.flatMap(r=>r.bad));

  const tools = document.getElementById('tools'); tools.innerHTML = '';
  unlocked().forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tool'; b.textContent = TOOLS[t].e+' '+TOOLS[t].n;
    b.setAttribute('aria-pressed', tool===t);
    b.onclick = ()=>{ tool = tool===t ? null : t; notice=''; render(); };
    tools.appendChild(b);
  });
  const er = document.createElement('button');            
  er.className = 'tool'; er.textContent = '🗑️ Usuń';
  er.setAttribute('aria-pressed', tool===null);
  er.onclick = ()=>{ tool = null; notice=''; render(); };
  tools.appendChild(er);
  document.getElementById('status').textContent = notice ||
    (tool ? `Zaznaczone: ${TOOLS[tool].n}. Klik na kratkę stawia bloczek.`
          : 'Gumka: klik na kratkę usuwa bloczek.');

  const board = document.getElementById('board'); board.innerHTML = '';
  const floorBase = floor*rows*W;
  for(let loc=0; loc<rows*W; loc++){
    const i = floorBase + loc;
    const t = cells[i];
    const b = document.createElement('button');
    b.className = 'cell' + (t?' '+t:'') + (bad.has(i)?' bad':'') + (i===pop?' pop':'');
    b.textContent = t ? TOOLS[t].e : '';
    const r=Math.floor(loc/W)+1, c=loc%W+1;
    b.setAttribute('aria-label', `Piętro ${floor+1}, kratka ${r}, ${c}` + (t?': '+TOOLS[t].n:''));
    b.onclick = ()=>{ cells[i] = tool; pop = tool ? i : null; notice=''; update(); };
    board.appendChild(b);
  }

  // Dynamiczne rysowanie numeracji rzędów w oparciu o aktualną wartość `rows`
  const rowsEl = document.getElementById('rowLabels');
  if(rowsEl.children.length !== rows) {
    rowsEl.innerHTML = '';
    for(let n=rows; n>=1; n--) {
      const s = document.createElement('span'); 
      s.textContent = n; 
      rowsEl.appendChild(s);
    }
    rowsEl.style.gridTemplateRows = `repeat(${rows}, 1fr)`;
  }

  const nav = document.getElementById('floorNav');
  nav.style.display = numFloors>1 ? 'flex' : 'none';
  if(numFloors>1){
    document.getElementById('floorUp').disabled = floor===0;
    document.getElementById('floorDown').disabled = floor===numFloors-1;
    document.getElementById('floorLabel').textContent =
      floor===0 ? 'Najwyższe piętro'
      : floor===numFloors-1 ? 'Najniższe piętro'
      : `Piętro ${floor+1} z ${numFloors}`;
  }
  const renderGhost = (elId, fl) => {
    const el = document.getElementById(elId);
    if(fl<0 || fl>=numFloors){ el.style.display='none'; el.innerHTML=''; return; }
    el.style.display = 'grid'; el.innerHTML = '';
    const base = fl*rows*W;
    for(let loc=0; loc<rows*W; loc++){
      const t = cells[base+loc];
      const d = document.createElement('div');
      d.className = 'ghost-cell' + (t?' '+t:'');
      d.textContent = t ? TOOLS[t].e : '';
      el.appendChild(d);
    }
  };
  renderGhost('ghostAbove', floor-1);
  renderGhost('ghostBelow', floor+1);

  const list = document.getElementById('rules'); list.innerHTML = '';
  const order = [...Array(stage).keys()].reverse()     
    .sort((a,b)=> results[a].ok - results[b].ok);      
  for(const k of order){
    const r = results[k], li = document.createElement('li');
    li.className = 'rule' + (r.ok?' ok':'') + (k===newRule?' new':'');
    li.innerHTML = `<span class="mark">${r.ok?'✓':'✗'}</span><span></span><span class="info"></span>`;
    const txt = typeof RULES[k].text === 'function' ? RULES[k].text() : RULES[k].text;
    li.children[1].textContent = `${k+1}. ${txt}`;
    li.children[2].textContent = r.info || '';
    list.appendChild(li);
  }
  document.getElementById('win').innerHTML =
    (stage===RULES.length && results.every(r=>r.ok))
      ? '<div class="win">Wszystkie zasady spełnione! Kolejne wkrótce.</div>' : '';
  pop = null; newRule = null;
}

document.getElementById('reset').onclick = ()=>{
  if(confirm('Na pewno zacząć od nowa? Cała plansza zostanie wyczyszczona.')) init();
};
document.getElementById('floorUp').onclick = ()=>changeFloor(-1);
document.getElementById('floorDown').onclick = ()=>changeFloor(1);
(function initLabels(){                      
  const cols = document.getElementById('colLabels');
  'ABCDEFGH'.split('').forEach(ch=>{ const s=document.createElement('span'); s.textContent=ch; cols.appendChild(s); });
})();
init();
setInterval(()=>{ notice=''; update(); }, 30000);   
</script>
</body>
</html>
